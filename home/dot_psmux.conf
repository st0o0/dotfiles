# Managed by chezmoi — psmux config for Windows workstation.
# Catppuccin Mocha colors, Powerline-arrow capsule style.
# Mirrors the Linux tmux config (dot_tmux.conf.tmpl) appearance.

set -g default-shell pwsh

set -g mouse on
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",*:Tc"
set -as terminal-features ",xterm*:mouse"
set -g focus-events on
set -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 10000
set -sg escape-time 10
set -g xterm-keys on
set -s set-clipboard on

# Prefix: C-y (same as Linux workstation tmux)
unbind C-b
set -g prefix C-y
bind C-y send-prefix

# Reload config
bind r source-file ~/.psmux.conf \; display-message "psmux.conf reloaded"

# ── Copy/Paste ──────────────────────────────────────────────────────
unbind -T copy-mode MouseDragEnd1Pane
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode C-c send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-c send-keys -X copy-selection-and-cancel
bind-key -n C-v paste-buffer
bind-key -T copy-mode MouseDown3Pane send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDown3Pane send-keys -X copy-selection-and-cancel

# ── Status bar — Catppuccin Mocha, Powerline capsules ───────────────
# Palette:
#   base    #1e1e2e   text     #cdd6f4   surface0 #313244
#   mauve   #cba6f7   peach    #fab387   blue     #89b4fa
#   lavender #b4befe  subtext0 #a6adc8   green    #a6e3a1

set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left: session name as a mauve pill
set -g status-left-length 30
set -g status-left "#[fg=#cba6f7,bg=default]#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[fg=#cba6f7,bg=#313244]"

# Window list — inactive=surface, active=peach. Claude Code done-check
# (green ✓) mirrors the Linux tmux config's after-select-window hook.
set -g window-status-separator ""
setw -g window-status-format "#[fg=#a6adc8,bg=#313244] #I:#W#[fg=#a6e3a1]#{?#(test -f /tmp/.claude-tmux-done/#{window_id} && echo 1), ✓,} #{?window_end_flag,#[fg=#313244]#[bg=default],}"
setw -g window-status-current-format "#[fg=#313244,bg=#fab387]#[fg=#1e1e2e,bg=#fab387,bold] #I:#W #{?window_end_flag,#[fg=#fab387]#[bg=default],#[fg=#fab387]#[bg=#313244]}"
set-hook -g after-select-window "run-shell \"rm -f /tmp/.claude-tmux-done/#{window_id}\""

# Right: prefix indicator (desktop icon, lavender→red when prefix held),
# then dynamic statusbar via psmux-statusbar.ps1 (git, dir, date, time).
set -g status-right-length 150
set -g status-right "#[fg=#{?client_prefix,#f38ba8,#b4befe}]#[bg=default]#[fg=#1e1e2e]#[bg=#{?client_prefix,#f38ba8,#b4befe}]#[bold]  #[nobold]#(pwsh -NoProfile -File ~/.local/bin/psmux-statusbar.ps1 '#{pane_current_path}' '#{client_width}' '#{session_name}' '#{W:#I:#{window_name} }' '#{?client_prefix,#f38ba8,#b4befe}')"
