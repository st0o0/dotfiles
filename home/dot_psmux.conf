# Managed by chezmoi  psmux config for Windows workstation.
# Catppuccin Mocha colors, Powerline capsule style.
# Mirrors the Linux tmux config (dot_tmux.conf.tmpl) appearance.

set -g default-shell pwsh

set -g mouse on
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",*:Tc"
set -as terminal-features ",xterm*:mouse"
set -g focus-events on
set -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 10000
set -sg escape-time 10
set -g xterm-keys on
set -s set-clipboard on

# Prefix: C-Space (same as Linux workstation tmux)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config
bind r source-file ~/.psmux.conf \; display-message "psmux.conf reloaded"

# prefix+C = new named session (prefix+c = new window, prefix+s = session list)
bind C command-prompt -p "New session:" "new-session -s '%%'"

#  Copy/Paste 
unbind -T copy-mode MouseDragEnd1Pane
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode C-c send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-c send-keys -X copy-selection-and-cancel
bind-key -n C-v paste-buffer
bind-key -T copy-mode MouseDown3Pane send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDown3Pane send-keys -X copy-selection-and-cancel

#  Status bar  Catppuccin Mocha, Powerline capsules 
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left: session name as a mauve pill
set -g status-left-length 30
set -g status-left "#[fg=#cba6f7,bg=default]#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[fg=#cba6f7,bg=#313244]"

# Window list
set -g window-status-separator ""
setw -g window-status-format "#[fg=#a6adc8,bg=#313244] #I:#W #{?window_end_flag,#[fg=#313244]#[bg=default]#[default],}"
setw -g window-status-current-format "#[fg=#313244,bg=#fab387]#[fg=#1e1e2e,bg=#fab387,bold] #I:#W #{?window_end_flag,#[fg=#fab387]#[bg=default]#[default],#[fg=#fab387]#[bg=#313244]}"

# Right: mode indicator (copy/prefix/normal) + dir + date + time (static, no external script)
set -g status-right-length 150
set -g status-right "#[fg=#{?pane_in_mode,#f9e2af,#{?client_prefix,#f38ba8,#b4befe}}]#[bg=default]#[fg=#1e1e2e]#[bg=#{?pane_in_mode,#f9e2af,#{?client_prefix,#f38ba8,#b4befe}}]#[bold] #{?pane_in_mode,COPY,} #[nobold]#[fg=#fab387,bg=#{?pane_in_mode,#f9e2af,#{?client_prefix,#f38ba8,#b4befe}}]#[fg=#1e1e2e,bg=#fab387,bold]  #{b:pane_current_path} #[nobold]#[fg=#89b4fa,bg=#fab387]#[fg=#1e1e2e,bg=#89b4fa,bold]  %d.%m. #[nobold]#[fg=#b4befe,bg=#89b4fa]#[fg=#1e1e2e,bg=#b4befe,bold]  %H:%M #[nobold]#[fg=#b4befe,bg=default]#[default]"
