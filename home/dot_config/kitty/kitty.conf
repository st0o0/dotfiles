# Managed by chezmoi — workstation profile only.

term xterm-256color
kitty_mod ctrl+shift
scrollback_lines 10000
clipboard_control write-clipboard read-clipboard

# Copy/paste is owned by tmux (see .tmux.conf) — disable kitty's own
# shortcuts so there's only one path. clipboard_control stays enabled
# so tmux's OSC 52 write reaches the OS clipboard.
map kitty_mod+c no_op
map kitty_mod+v no_op

font_family JetBrainsMono Nerd Font Mono
font_size 12.0

# Catppuccin Mocha — matches starship.toml and .tmux.conf palette.
foreground #CDD6F4
background #1E1E2E
selection_foreground #1E1E2E
selection_background #F5E0DC
cursor #F5E0DC
cursor_text_color #1E1E2E
url_color #F5E0DC
active_border_color #B4BEFE
inactive_border_color #6C7086
bell_border_color #F9E2AF
wayland_titlebar_color system
macos_titlebar_color system
active_tab_background #1E1E2E
active_tab_foreground #CDD6F4
inactive_tab_background #11111B
inactive_tab_foreground #CDD6F4
tab_bar_background #11111B

color0 #45475A
color8 #585B70
